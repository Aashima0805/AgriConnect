<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Products - AgriConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="navbar-container"></div>
    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="mb-0"><i class="bi bi-basket3"></i> My Products</h2>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#productModal"><i class="bi bi-plus-lg"></i> Add Product</button>
        </div>
        <div id="alertContainer"></div>
        <div id="productsContainer" class="row g-3"></div>
    </main>
    <!-- Loading overlay -->
    <div id="loadingOverlay" class="agri-loading d-none" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.8);display:flex;justify-content:center;align-items:center;z-index:1050;">
        <div class="spinner-border text-success" role="status"><span class="visually-hidden">Loading...</span></div>
    </div>
    <!-- Product Modal -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="productModalLabel">Add / Edit Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="productForm">
                        <input type="hidden" id="productId">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" id="productName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <input type="text" class="form-control" id="productCategory">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="productDescription"></textarea>
                        </div>
                        <div class="row g-2">
                            <div class="col-6">
                                <label class="form-label">Price</label>
                                <input type="number" step="0.01" class="form-control" id="productPrice" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Quantity</label>
                                <input type="number" step="0.01" class="form-control" id="productQuantity" required>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveProduct()">Save</button>
                </div>
            </div>
        </div>
    </div>
    <footer class="agri-footer mt-auto">
        <div class="container text-center">
            <p class="mb-0 small text-white-50">AgriConnect • Farmer Module</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script src="farmer-api.js"></script>
    <script>
        let currentUser = null;
        document.addEventListener('DOMContentLoaded', async () => {
            const user = AgriAuth.requireAuth('FARMER');
            if (!user) return;
            currentUser = user;
            AgriAuth.renderNavbar('navbar-container', 'products');
            loadProducts();
        });

        async function loadProducts() {
            FarmerAPI.showLoading(true);
            try {
                const resp = await FarmerAPI.get(`/api/products/farmer/${currentUser.id}`);
                if (resp.ok) {
                    renderProducts(resp.data);
                } else {
                    FarmerAPI.showAlert('danger', resp.data.error || 'Failed to load products');
                }
            } catch (e) {
                console.error(e);
                FarmerAPI.showAlert('danger', 'Error loading products');
            } finally {
                FarmerAPI.showLoading(false);
            }
        }

        function renderProducts(list) {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';
            if (!list || list.length === 0) {
                container.innerHTML = '<p class="text-muted">No products found. Add a new product using the button above.</p>';
                return;
            }
            list.forEach(p => {
                const col = document.createElement('div');
                col.className = 'col-md-4';
                col.innerHTML = `
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">${p.name}</h5>
                            <h6 class="card-subtitle mb-2 text-muted">${p.category || ''}</h6>
                            <p class="card-text">${p.description || ''}</p>
                            <p class="card-text"><strong>Price:</strong> ₹${p.price}</p>
                            <p class="card-text"><strong>Qty:</strong> ${p.quantity} ${p.unit || ''}</p>
                        </div>
                        <div class="card-footer d-flex justify-content-between">
                            <button class="btn btn-sm btn-outline-primary" onclick="editProduct(${p.id})"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${p.id})"><i class="bi bi-trash"></i></button>
                        </div>
                    </div>
                `;
                container.appendChild(col);
            });
        }

        function openAddModal() {
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            new bootstrap.Modal(document.getElementById('productModal')).show();
        }

        function editProduct(id) {
            // find product data from current rendered list (could cache) – for simplicity, fetch again
            FarmerAPI.get(`/api/products/${id}`).then(resp => {
                if (resp.ok) {
                    const p = resp.data;
                    document.getElementById('productId').value = p.id;
                    document.getElementById('productName').value = p.name;
                    document.getElementById('productCategory').value = p.category || '';
                    document.getElementById('productDescription').value = p.description || '';
                    document.getElementById('productPrice').value = p.price;
                    document.getElementById('productQuantity').value = p.quantity;
                    new bootstrap.Modal(document.getElementById('productModal')).show();
                } else {
                    FarmerAPI.showAlert('danger', 'Failed to fetch product for edit');
                }
            }).catch(e => {
                console.error(e);
                FarmerAPI.showAlert('danger', 'Error fetching product');
            });
        }

        async function saveProduct() {
            const id = document.getElementById('productId').value;
            const payload = {
                name: document.getElementById('productName').value,
                category: document.getElementById('productCategory').value,
                description: document.getElementById('productDescription').value,
                price: parseFloat(document.getElementById('productPrice').value),
                quantity: parseFloat(document.getElementById('productQuantity').value)
            };
            FarmerAPI.showLoading(true);
            try {
                let resp;
                if (id) {
                    resp = await FarmerAPI.put(`/api/products/${id}`, payload);
                } else {
                    resp = await FarmerAPI.post(`/api/products`, payload);
                }
                if (resp.ok) {
                    FarmerAPI.showAlert('success', 'Product saved successfully');
                    bootstrap.Modal.getInstance(document.getElementById('productModal')).hide();
                    loadProducts();
                } else {
                    FarmerAPI.showAlert('danger', resp.data.error || 'Failed to save product');
                }
            } catch (e) {
                console.error(e);
                FarmerAPI.showAlert('danger', 'Error saving product');
            } finally {
                FarmerAPI.showLoading(false);
            }
        }

        async function deleteProduct(id) {
            if (!confirm('Delete this product?')) return;
            FarmerAPI.showLoading(true);
            try {
                const resp = await FarmerAPI.del(`/api/products/${id}`);
                if (resp.ok) {
                    FarmerAPI.showAlert('success', 'Product deleted');
                    loadProducts();
                } else {
                    FarmerAPI.showAlert('danger', 'Failed to delete product');
                }
            } catch (e) {
                console.error(e);
                FarmerAPI.showAlert('danger', 'Error deleting product');
            } finally {
                FarmerAPI.showLoading(false);
            }
        }
    </script>
</body>
</html>
