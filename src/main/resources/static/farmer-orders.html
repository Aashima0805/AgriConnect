
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Orders - AgriConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="navbar-container"></div>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h2 class="mb-1">
                <i class="bi bi-box-seam text-success"></i>
                Customer Orders
            </h2>
            <p class="text-muted mb-0">
                Manage customer produce orders from confirmation to delivery.
            </p>
        </div>

        <a href="farmer-dashboard.html" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-2"></i>
            Dashboard
        </a>
    </div>

    <div id="alertContainer"></div>

    <div id="loadingContainer" class="text-center py-5">
        <div class="spinner-border text-success" role="status"></div>
        <p class="text-muted mt-2 mb-0">Loading customer orders...</p>
    </div>

    <div id="emptyContainer" class="text-center py-5 d-none">
        <div class="mb-3">
            <i class="bi bi-inbox fs-1 text-muted"></i>
        </div>
        <h5>No customer orders yet</h5>
        <p class="text-muted">
            Orders placed for your produce will appear here.
        </p>
    </div>

    <div id="ordersContainer" class="d-none">

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">

                        <thead class="table-light">
                            <tr>
                                <th>Order</th>
                                <th>Customer</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Payment</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="ordersTableBody"></tbody>

                    </table>
                </div>

            </div>
        </div>

    </div>

</main>

<footer class="agri-footer mt-auto">
    <div class="container text-center">
        <p class="mb-0 small text-white-50">
            AgriConnect • Farmer Module
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="auth.js"></script>
<script src="farmer-api.js"></script>

<script>

let currentUser = null;

document.addEventListener('DOMContentLoaded', async () => {

    const user = AgriAuth.requireAuth('FARMER');

    if (!user) {
        return;
    }

    currentUser = user;

    AgriAuth.renderNavbar('navbar-container', 'orders');

    await loadFarmerOrders();
});


async function loadFarmerOrders() {

    const loading = document.getElementById('loadingContainer');
    const empty = document.getElementById('emptyContainer');
    const orders = document.getElementById('ordersContainer');

    loading.classList.remove('d-none');
    empty.classList.add('d-none');
    orders.classList.add('d-none');

    try {

        const response = await FarmerAPI.get(
            `/api/orders/farmer/${currentUser.id}`
        );

        if (!response.ok) {

            showAlert(
                'danger',
                response.data?.error || 'Failed to load customer orders.'
            );

            return;
        }

        const orderList = response.data || [];

        if (orderList.length === 0) {

            empty.classList.remove('d-none');
            return;
        }

        renderOrders(orderList);

        orders.classList.remove('d-none');

    } catch (error) {

        console.error(error);

        showAlert(
            'danger',
            'Unable to load customer orders. Please try again.'
        );

    } finally {

        loading.classList.add('d-none');
    }
}


function renderOrders(orderList) {

    const tbody = document.getElementById('ordersTableBody');

    tbody.innerHTML = '';

    orderList.forEach(order => {

        const row = document.createElement('tr');

        const status = order.status || 'PLACED';

        const items = order.items || order.orderItems || [];

        const itemCount = items.length;

        let actionHtml = '';

        if (status === 'PLACED') {

            actionHtml = `
                <button
                    class="btn btn-sm btn-primary"
                    onclick="updateOrderStatus(${order.id}, 'CONFIRMED')">
                    <i class="bi bi-check-circle me-1"></i>
                    Confirm Order
                </button>
            `;

        } else if (status === 'CONFIRMED') {

            actionHtml = `
                <button
                    class="btn btn-sm btn-primary"
                    onclick="updateOrderStatus(${order.id}, 'PACKED')">
                    <i class="bi bi-box-seam me-1"></i>
                    Mark as Packed
                </button>
            `;

        } else if (status === 'PACKED') {

            actionHtml = `
                <button
                    class="btn btn-sm btn-primary"
                    onclick="updateOrderStatus(${order.id}, 'SHIPPED')">
                    <i class="bi bi-truck me-1"></i>
                    Mark as Shipped
                </button>
            `;

        } else if (status === 'SHIPPED') {

            actionHtml = `
                <button
                    class="btn btn-sm btn-primary"
                    onclick="updateOrderStatus(${order.id}, 'OUT_FOR_DELIVERY')">
                    <i class="bi bi-bicycle me-1"></i>
                    Out for Delivery
                </button>
            `;

        } else if (status === 'OUT_FOR_DELIVERY') {

            actionHtml = `
                <button
                    class="btn btn-sm btn-success"
                    onclick="updateOrderStatus(${order.id}, 'DELIVERED')">
                    <i class="bi bi-check2-all me-1"></i>
                    Mark as Delivered
                </button>
            `;

        } else if (status === 'DELIVERED') {

            actionHtml = `
                <span class="badge bg-success">
                    <i class="bi bi-check-circle me-1"></i>
                    Order Completed
                </span>
            `;

        } else if (status === 'CANCELLED') {

            actionHtml = `
                <span class="badge bg-danger">
                    Cancelled
                </span>
            `;

        } else {

            actionHtml = `
                <span class="text-muted">
                    No action
                </span>
            `;
        }

        row.innerHTML = `
            <td>
                <strong>#${order.id}</strong>
                <div class="small text-muted">
                    ${formatDate(order.createdAt)}
                </div>
            </td>

            <td>
                <strong>
                    ${escapeHtml(
                        order.customer?.name ||
                        order.customerName ||
                        'Customer'
                    )}
                </strong>
            </td>

            <td>
                ${itemCount} item${itemCount === 1 ? '' : 's'}
            </td>

            <td>
                <strong>
                    ₹${formatAmount(order.totalAmount)}
                </strong>
            </td>

            <td>
                ${paymentBadge(order.paymentStatus)}
            </td>

            <td>
                ${statusBadge(status)}
            </td>

            <td>
                ${actionHtml}
            </td>
        `;

        tbody.appendChild(row);
    });
}


async function updateOrderStatus(orderId, status) {

    if (!currentUser || currentUser.role !== 'FARMER') {

        showAlert(
            'danger',
            'Only farmers can update customer order status.'
        );

        return;
    }

    try {

        const response = await FarmerAPI.put(
            `/api/orders/${orderId}/status?farmerId=${currentUser.id}`,
            {
                status: status
            }
        );

        if (!response.ok) {

            showAlert(
                'danger',
                response.data?.error || 'Status update failed.'
            );

            return;
        }

        showAlert(
            'success',
            `Order #${orderId} updated to ${formatStatus(status)}.`
        );

        await loadFarmerOrders();

    } catch (error) {

        console.error(error);

        showAlert(
            'danger',
            'Unable to update order status. Please try again.'
        );
    }
}


function statusBadge(status) {

    const labels = {
        PLACED: 'Placed',
        CONFIRMED: 'Confirmed',
        PACKED: 'Packed',
        SHIPPED: 'Shipped',
        OUT_FOR_DELIVERY: 'Out for Delivery',
        DELIVERED: 'Delivered',
        CANCELLED: 'Cancelled'
    };

    const classes = {
        PLACED: 'bg-warning text-dark',
        CONFIRMED: 'bg-primary',
        PACKED: 'bg-info text-dark',
        SHIPPED: 'bg-secondary',
        OUT_FOR_DELIVERY: 'bg-warning text-dark',
        DELIVERED: 'bg-success',
        CANCELLED: 'bg-danger'
    };

    return `
        <span class="badge ${classes[status] || 'bg-secondary'}">
            ${labels[status] || status}
        </span>
    `;
}


function paymentBadge(paymentStatus) {

    if (paymentStatus === 'PAID') {

        return `
            <span class="badge bg-success">
                Paid
            </span>
        `;
    }

    if (paymentStatus === 'FAILED') {

        return `
            <span class="badge bg-danger">
                Failed
            </span>
        `;
    }

    return `
        <span class="badge bg-warning text-dark">
            Pending
        </span>
    `;
}


function formatStatus(status) {

    return status
        .toLowerCase()
        .replace(/_/g, ' ')
        .replace(/\b\w/g, char => char.toUpperCase());
}


function formatAmount(amount) {

    const value = Number(amount || 0);

    return value.toLocaleString('en-IN', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}


function formatDate(dateValue) {

    if (!dateValue) {
        return '';
    }

    const date = new Date(dateValue);

    if (Number.isNaN(date.getTime())) {
        return '';
    }

    return date.toLocaleDateString('en-IN', {
        day: '2-digit',
        month: 'short',
        year: 'numeric'
    });
}


function escapeHtml(value) {

    const div = document.createElement('div');

    div.textContent = value == null ? '' : String(value);

    return div.innerHTML;
}


function showAlert(type, message) {

    const container = document.getElementById('alertContainer');

    container.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            ${escapeHtml(message)}
            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert">
            </button>
        </div>
    `;
}

</script>

</body>
</html>
