<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="auth.js"></script>

<script>
let currentUser = null;
let equipmentId = null;
let equipment = null;

document.addEventListener('DOMContentLoaded', async () => {

    currentUser = AgriAuth.requireAuth('FARMER');

    if (!currentUser) {
        return;
    }

    AgriAuth.renderNavbar('navbar-container', 'rent-equipment');

    const params = new URLSearchParams(window.location.search);

    equipmentId = params.get('equipmentId');

    if (!equipmentId) {
        showError('Equipment ID is missing.');
        return;
    }

    await loadEquipment();
    setupDateInputs();
});

async function loadEquipment() {

    try {

        const response = await fetch(
            `/api/equipment/${equipmentId}`,
            {
                credentials: 'include'
            }
        );

        if (!response.ok) {
            throw new Error('Unable to load equipment details.');
        }

        equipment = await response.json();

        document.getElementById('equipmentName').textContent =
            equipment.name || 'Equipment';

        document.getElementById('equipmentType').textContent =
            equipment.type || 'Agricultural Equipment';

        document.getElementById('equipmentDescription').textContent =
            equipment.description || 'No description available.';

        document.getElementById('equipmentPrice').textContent =
            Number(equipment.rentalPricePerDay || 0).toLocaleString('en-IN');

        document.getElementById('summaryPrice').textContent =
            Number(equipment.rentalPricePerDay || 0).toLocaleString('en-IN');

        document.getElementById('equipmentLocation').textContent =
            equipment.location || 'Location not specified';

        document.getElementById('equipmentOwner').textContent =
            equipment.ownerName || 'Farmer';

        const availability =
            document.getElementById('equipmentAvailability');

        if (equipment.available) {

            availability.textContent = 'Available';
            availability.className = 'badge bg-success';

        } else {

            availability.textContent = 'Currently Unavailable';
            availability.className = 'badge bg-danger';

            document.getElementById('requestRentalBtn').disabled = true;
        }

        document.getElementById('loadingBox').classList.add('d-none');
        document.getElementById('rentContent').classList.remove('d-none');

    } catch (error) {

        showError(error.message);

    }
}

function setupDateInputs() {

    const today = new Date().toISOString().split('T')[0];

    const startDate = document.getElementById('startDate');
    const endDate = document.getElementById('endDate');

    startDate.min = today;
    endDate.min = today;

    startDate.addEventListener('change', updateRentalSummary);
    endDate.addEventListener('change', updateRentalSummary);

    document
        .getElementById('requestRentalBtn')
        .addEventListener('click', requestRental);
}

function updateRentalSummary() {

    const startValue =
        document.getElementById('startDate').value;

    const endValue =
        document.getElementById('endDate').value;

    const dateError =
        document.getElementById('dateError');

    const button =
        document.getElementById('requestRentalBtn');

    dateError.classList.add('d-none');
    button.disabled = true;

    document.getElementById('summaryDays').textContent = '0';
    document.getElementById('summaryTotal').textContent = '0';

    if (!startValue || !endValue) {
        return;
    }

    const start = new Date(startValue + 'T00:00:00');
    const end = new Date(endValue + 'T00:00:00');

    if (end < start) {

        dateError.textContent =
            'End date cannot be before the start date.';

        dateError.classList.remove('d-none');

        return;
    }

    const difference =
        Math.round((end - start) / (1000 * 60 * 60 * 24));

    const days = difference + 1;

    const price =
        Number(equipment.rentalPricePerDay || 0);

    const total =
        price * days;

    document.getElementById('summaryDays').textContent =
        days;

    document.getElementById('summaryTotal').textContent =
        total.toLocaleString('en-IN');

    button.disabled = !equipment.available;
}

async function requestRental() {

    const startDate =
        document.getElementById('startDate').value;

    const endDate =
        document.getElementById('endDate').value;

    const button =
        document.getElementById('requestRentalBtn');

    const successBox =
        document.getElementById('successBox');

    if (!startDate || !endDate) {
        return;
    }

    button.disabled = true;

    button.innerHTML =
        '<span class="spinner-border spinner-border-sm me-2"></span>Submitting...';

    successBox.classList.add('d-none');

    try {

        const response = await fetch(
            '/api/equipment-rentals',
            {
                method: 'POST',
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    equipmentId: Number(equipmentId),
                    renterId: currentUser.id,
                    startDate: startDate,
                    endDate: endDate
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || 'Unable to create rental request.'
            );
        }

        successBox.innerHTML =
            '<strong>Rental request submitted!</strong><br>' +
            'The equipment owner must approve your request before the rental is confirmed.';

        successBox.classList.remove('d-none');

        document.getElementById('startDate').disabled = true;
        document.getElementById('endDate').disabled = true;

        button.innerHTML =
            '<i class="bi bi-check-circle me-2"></i>Request Submitted';

    } catch (error) {

        alert(error.message);

        button.disabled = false;

        button.innerHTML =
            '<i class="bi bi-send me-2"></i>Request Rental';
    }
}

function showError(message) {

    document.getElementById('loadingBox').classList.add('d-none');

    const errorBox =
        document.getElementById('errorBox');

    errorBox.textContent = message;

    errorBox.classList.remove('d-none');
}
</script>
