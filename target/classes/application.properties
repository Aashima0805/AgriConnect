spring.application.name=AgriConnect
server.port=${PORT:8081}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agriconnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&zeroDateTimeBehavior=CONVERT_TO_NULL}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Python AI Microservice
ai.service.url=${AI_SERVICE_URL:http://localhost:5000}
ai.confidence.threshold=0.50

# OpenWeatherMap API
weather.api.key=${WEATHER_API_KEY:}
weather.api.base-url=https://api.openweathermap.org/data/2.5/weather

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Web static resource caching
spring.web.resources.cache.period=0


