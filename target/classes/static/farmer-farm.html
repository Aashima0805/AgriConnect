<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Farm - AgriConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="navbar-container"></div>
    <main class="container py-4">
        <h2 class="mb-4"><i class="bi bi-geo-alt"></i> Farm Profile</h2>
        <div id="alertContainer"></div>
        <form id="farmForm">
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Land Area</label>
                    <input type="number" step="0.01" class="form-control" id="landArea" placeholder="e.g., 5.5">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Land Unit</label>
                    <input type="text" class="form-control" id="landUnit" placeholder="e.g., acres">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Location</label>
                <input type="text" class="form-control" id="location" placeholder="Address or GPS">
            </div>
            <div class="mb-3">
                <label class="form-label">Crops (comma separated)</label>
                <input type="text" class="form-control" id="crops" placeholder="e.g., rice,wheat">
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Soil Type</label>
                    <input type="text" class="form-control" id="soilType">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Irrigation Type</label>
                    <input type="text" class="form-control" id="irrigationType">
                </div>
            </div>
            <button type="button" class="btn btn-primary" onclick="saveFarm()"><i class="bi bi-save"></i> Save</button>
            <button type="reset" class="btn btn-secondary ms-2"><i class="bi bi-arrow-counterclockwise"></i> Cancel</button>
        </form>
    </main>
    <footer class="agri-footer mt-auto">
        <div class="container text-center">
            <p class="mb-0 small text-white-50">AgriConnect • Farmer Module</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script src="farmer-api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = AgriAuth.requireAuth('FARMER');
            if (!user) return;
            AgriAuth.renderNavbar('navbar-container', 'farm');
            const farmerId = user.id;
            FarmerAPI.showLoading(true);
            try {
                const resp = await FarmerAPI.get(`/api/farms/${farmerId}`);
                if (resp.ok) {
                    const p = resp.data;
                    document.getElementById('landArea').value = p.landArea ?? '';
                    document.getElementById('landUnit').value = p.landUnit ?? '';
                    document.getElementById('location').value = p.location ?? '';
                    document.getElementById('crops').value = p.crops ?? '';
                    document.getElementById('soilType').value = p.soilType ?? '';
                    document.getElementById('irrigationType').value = p.irrigationType ?? '';
                } else {
                    FarmerAPI.showAlert('danger', resp.data.error || 'Failed to load farm details');
                }
            } catch (e) {
                console.error(e);
                FarmerAPI.showAlert('danger', 'Error loading farm details');
            } finally {
                FarmerAPI.showLoading(false);
            }
        });

        async function saveFarm() {
            const user = AgriAuth.getUser();
            if (!user) return;
            const farmerId = user.id;
            const payload = {
                landArea: document.getElementById('landArea').value,
                landUnit: document.getElementById('landUnit').value,
                location: document.getElementById('location').value,
                crops: document.getElementById('crops').value,
                soilType: document.getElementById('soilType').value,
                irrigationType: document.getElementById('irrigationType').value
            };
            FarmerAPI.showLoading(true);
            try {
                const resp = await FarmerAPI.put(`/api/farms/${farmerId}`, payload);
                if (resp.ok) {
                    FarmerAPI.showAlert('success', 'Farm profile saved successfully');
                } else {
                    FarmerAPI.showAlert('danger', resp.data.error || 'Failed to save');
                }
            } catch (e) {
                console.error(e);
                FarmerAPI.showAlert('danger', 'Error saving farm');
            } finally {
                FarmerAPI.showLoading(false);
            }
        }
    </script>
</body>
</html>
