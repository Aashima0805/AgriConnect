<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - AgriConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body>

    <div id="navbar-container"></div>

    <main class="container py-4">

        <div class="mb-4">
            <h2 class="fw-bold text-dark mb-1">
                <i class="bi bi-shop text-success"></i>
                Produce Marketplace
            </h2>
            <p class="text-muted mb-0">
                Browse fresh produce directly from farmers.
            </p>
        </div>

        <section class="mb-4">
            <div class="row g-2 align-items-center">

                <div class="col-md-7">
                    <div class="input-group">
                        <input
                            type="text"
                            id="searchInput"
                            class="form-control"
                            placeholder="Search products..."
                        >
                        <button
                            class="btn btn-success"
                            type="button"
                            id="searchBtn"
                        >
                            <i class="bi bi-search"></i>
                            Search
                        </button>
                    </div>
                </div>

                <div class="col-md-5">
                    <select id="categorySelect" class="form-select">
                        <option value="">All Categories</option>
                    </select>
                </div>

            </div>
        </section>

        <div id="marketplaceLoading" class="text-center py-5">
            <div class="spinner-border text-success" role="status"></div>
            <p class="text-muted mt-2 mb-0">Loading produce...</p>
        </div>

        <div id="marketplaceError" class="alert alert-danger d-none"></div>

        <div id="productGrid" class="row g-4"></div>

        <div id="emptyProducts" class="text-center py-5 d-none">
            <i class="bi bi-basket3 display-4 text-muted"></i>
            <h4 class="mt-3">No Produce Found</h4>
            <p class="text-muted">
                Try changing the search or category filter.
            </p>
        </div>

        <div class="text-center">
            <button
                id="loadMoreBtn"
                class="btn btn-outline-success mt-4 d-none"
                type="button"
            >
                Load More
            </button>
        </div>

    </main>

    <!-- Product Detail Modal -->
    <div
        class="modal fade"
        id="productDetailModal"
        tabindex="-1"
        aria-labelledby="productDetailLabel"
        aria-hidden="true"
    >
        <div class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="productDetailLabel">
                        Product Details
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>
                </div>

                <div
                    class="modal-body"
                    id="productDetailBody"
                ></div>

            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script src="farmer-api.js"></script>
    <script src="customer-marketplace.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = AgriAuth.requireAuth('CUSTOMER');

            if (!user) {
                return;
            }

            AgriAuth.renderNavbar('navbar-container', 'marketplace');

            initMarketplace();
        });
    </script>

</body>
</html>
