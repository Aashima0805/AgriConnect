<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Rentals - AgriConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        .rental-card {
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .rental-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .rental-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: #eaf7ee;
            color: #198754;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .detail-label {
            font-size: 0.8rem;
            color: #6b7280;
            margin-bottom: 2px;
        }

        .detail-value {
            font-weight: 600;
            color: #374151;
        }

        .status-badge {
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .empty-state {
            border: 1px dashed #cfd8d3;
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<div id="navbar-container"></div>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">
                <i class="bi bi-calendar-check text-success"></i>
                My Rentals
            </h2>

            <p class="text-muted mb-0">
                View equipment you have requested from other farmers.
            </p>
        </div>

        <a href="farmer-equipment-marketplace.html"
           class="btn btn-outline-success">
            <i class="bi bi-search me-1"></i>
            Rent Equipment
        </a>
    </div>

    <div id="alertContainer"></div>

    <div id="loadingContainer" class="text-center py-5">
        <div class="spinner-border text-success" role="status"></div>
        <p class="text-muted mt-2">Loading your rentals...</p>
    </div>

    <div id="emptyContainer" class="empty-state d-none">
        <i class="bi bi-calendar-x display-4 text-muted"></i>

        <h5 class="mt-3">
            No rentals yet
        </h5>

        <p class="text-muted">
            You have not requested any equipment from other farmers.
        </p>

        <a href="farmer-equipment-marketplace.html"
           class="btn btn-success">
            <i class="bi bi-tractor me-1"></i>
            Browse Equipment
        </a>
    </div>

    <div id="rentalsContainer" class="row g-4"></div>

</main>

<footer class="agri-footer mt-auto">
    <div class="container text-center">
        <p class="mb-0 small text-white-50">
            AgriConnect • Farmer Module
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="auth.js"></script>
<script src="farmer-api.js"></script>

<script>

let currentUser = null;

document.addEventListener('DOMContentLoaded', async () => {

    const user = AgriAuth.requireAuth('FARMER');

    if (!user) return;

    currentUser = user;

    AgriAuth.renderNavbar('navbar-container', 'my-rentals');

    await loadMyRentals();
});


async function loadMyRentals() {

    const loading = document.getElementById('loadingContainer');
    const empty = document.getElementById('emptyContainer');
    const container = document.getElementById('rentalsContainer');

    loading.classList.remove('d-none');
    empty.classList.add('d-none');
    container.innerHTML = '';

    try {

        const response = await FarmerAPI.get(
            `/api/equipment-rentals/renter/${currentUser.id}`
        );

        if (!response.ok) {

            showRentalAlert(
                'danger',
                response.data?.error || 'Failed to load your rentals.'
            );

            return;
        }

        renderMyRentals(response.data);

    } catch (error) {

        console.error(error);

        showRentalAlert(
            'danger',
            'Unable to load your rentals. Please try again.'
        );

    } finally {

        loading.classList.add('d-none');
    }
}


function renderMyRentals(rentals) {

    const container = document.getElementById('rentalsContainer');
    const empty = document.getElementById('emptyContainer');

    container.innerHTML = '';

    if (!rentals || rentals.length === 0) {

        empty.classList.remove('d-none');

        return;
    }

    rentals.forEach(rental => {

        const equipment = rental.equipment || {};
        const owner = rental.owner || {};

        const status = rental.status || 'PENDING';
        const paymentStatus = rental.paymentStatus || 'PENDING';

        const card = document.createElement('div');

        card.className = 'col-md-6 col-lg-4';

        card.innerHTML = `

            <div class="rental-card h-100 p-4">

                <div class="d-flex justify-content-between align-items-start mb-3">

                    <div class="d-flex align-items-center gap-3">

                        <div class="rental-icon">
                            <i class="bi bi-tractor"></i>
                        </div>

                        <div>
                            <h5 class="mb-1">
                                ${escapeHtml(equipment.name || 'Equipment')}
                            </h5>

                            <small class="text-muted">
                                ${escapeHtml(equipment.type || '')}
                            </small>
                        </div>

                    </div>

                    <span class="badge ${getStatusClass(status)} status-badge">
                        ${escapeHtml(status)}
                    </span>

                </div>

                <hr>

                <div class="row g-3">

                    <div class="col-6">
                        <div class="detail-label">
                            Owner
                        </div>

                        <div class="detail-value">
                            ${escapeHtml(owner.name || '-')}
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="detail-label">
                            Location
                        </div>

                        <div class="detail-value">
                            ${escapeHtml(equipment.location || '-')}
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="detail-label">
                            Start Date
                        </div>

                        <div class="detail-value">
                            ${formatDate(rental.startDate)}
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="detail-label">
                            End Date
                        </div>

                        <div class="detail-value">
                            ${formatDate(rental.endDate)}
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="detail-label">
                            Number of Days
                        </div>

                        <div class="detail-value">
                            ${rental.numberOfDays || 0}
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="detail-label">
                            Rental Amount
                        </div>

                        <div class="detail-value text-success">
                            ₹${formatAmount(rental.rentalAmount)}
                        </div>
                    </div>

                </div>

                <div class="mt-4 p-3 bg-light rounded">

    <div class="d-flex justify-content-between align-items-center">

        <span class="text-muted">
            Payment
        </span>

        <strong>
            ${escapeHtml(paymentStatus)}
        </strong>

    </div>

    ${
        status === 'APPROVED' && paymentStatus === 'PENDING'
        ? `
            <a
                href="farmer-rental-payment.html?rentalId=${rental.id}"
                class="btn btn-success w-100 mt-3">

                <i class="bi bi-credit-card me-1"></i>
                Pay Now
            </a>
        `
        : ''
    }

</div>

            </div>
        `;

        container.appendChild(card);
    });
}


function getStatusClass(status) {

    switch (status) {

        case 'PENDING':
            return 'bg-warning text-dark';

        case 'APPROVED':
            return 'bg-success';

        case 'ACTIVE':
            return 'bg-primary';

        case 'COMPLETED':
            return 'bg-secondary';

        case 'REJECTED':
            return 'bg-danger';

        case 'CANCELLED':
            return 'bg-dark';

        default:
            return 'bg-secondary';
    }
}


function formatDate(dateString) {

    if (!dateString) return '-';

    const date = new Date(dateString);

    return date.toLocaleDateString('en-IN', {
        day: '2-digit',
        month: 'short',
        year: 'numeric'
    });
}


function formatAmount(amount) {

    const value = Number(amount || 0);

    return value.toLocaleString('en-IN', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}


function escapeHtml(value) {

    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}


function showRentalAlert(type, message) {

    const container = document.getElementById('alertContainer');

    container.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show"
             role="alert">

            ${escapeHtml(message)}

            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert">
            </button>

        </div>
    `;
}

</script>

</body>
</html>
