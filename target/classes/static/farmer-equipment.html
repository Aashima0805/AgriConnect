<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Equipment - AgriConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="navbar-container"></div>
    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">
        <i class="bi bi-truck"></i> My Equipment
    </h2>

    <div class="d-flex gap-2">
    <a href="farmer-equipment-marketplace.html" class="btn btn-outline-success">
        <i class="bi bi-tractor me-2"></i>
        Rent Equipment
    </a>

    <a href="farmer-rental-requests.html" class="btn btn-outline-primary">
        <i class="bi bi-clipboard-check me-2"></i>
        Rental Requests
    </a>

    <button
        class="btn btn-success"
        data-bs-toggle="modal"
        data-bs-target="#equipmentModal">
        <i class="bi bi-plus-lg"></i>
        Add Equipment
    </button>
</div>
</div>
        <div id="alertContainer"></div>
        <div id="equipmentContainer" class="row g-3"></div>
    </main>
    <!-- Loading overlay -->
    <div id="loadingOverlay" class="agri-loading d-none" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.8);display:flex;justify-content:center;align-items:center;z-index:1050;">
        <div class="spinner-border text-success" role="status"><span class="visually-hidden">Loading...</span></div>
    </div>
    <!-- Equipment Modal -->
    <div class="modal fade" id="equipmentModal" tabindex="-1" aria-labelledby="equipmentModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="equipmentModalLabel">Add / Edit Equipment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <div class="modal-body">
                    <form id="equipmentForm">
                        <input type="hidden" id="equipmentId">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" id="equipmentName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Type</label>
                            <input type="text" class="form-control" id="equipmentType">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="equipmentDescription"></textarea>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label">Rental Price / Day</label>
                                <input type="number" step="0.01" class="form-control" id="equipmentPrice" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Location</label>
                                <input type="text" class="form-control" id="equipmentLocation">
                            </div>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="equipmentAvailable" checked>
                            <label class="form-check-label" for="equipmentAvailable">Available</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveEquipment()">Save</button>
                </div>
            </div>
        </div>
    </div>
    <footer class="agri-footer mt-auto">
        <div class="container text-center">
            <p class="mb-0 small text-white-50">AgriConnect • Farmer Module</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script src="farmer-api.js"></script>
    <script>
        let currentUser = null;
        document.addEventListener('DOMContentLoaded', async () => {
            const user = AgriAuth.requireAuth('FARMER');
            if (!user) return;
            currentUser = user;
            AgriAuth.renderNavbar('navbar-container', 'equipment');
            loadEquipment();
        });

        async function loadEquipment() {
            FarmerAPI.showLoading(true);
            try {
                const resp = await FarmerAPI.get(`/api/equipment/owner/${currentUser.id}`);
                if (resp.ok) {
                    renderEquipment(resp.data);
                } else {
                    FarmerAPI.showAlert('danger', resp.data.error || 'Failed to load equipment');
                }
            } catch (e) {
                console.error(e);
                FarmerAPI.showAlert('danger', 'Error loading equipment');
            } finally {
                FarmerAPI.showLoading(false);
            }
        }

        function renderEquipment(list) {
            const container = document.getElementById('equipmentContainer');
            container.innerHTML = '';
            if (!list || list.length === 0) {
                container.innerHTML = '<p class="text-muted">No equipment found. Add new equipment using the button above.</p>';
                return;
            }
            list.forEach(eq => {
                const col = document.createElement('div');
                col.className = 'col-md-4';
                col.innerHTML = `
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">${eq.name}</h5>
                            <h6 class="card-subtitle mb-2 text-muted">${eq.type || ''}</h6>
                            <p class="card-text">${eq.description || ''}</p>
                            <p class="card-text"><strong>Price/day:</strong> $${eq.rentalPricePerDay}</p>
                            <p class="card-text"><strong>Location:</strong> ${eq.location || ''}</p>
                            <p class="card-text"><strong>Available:</strong> ${eq.available ? 'Yes' : 'No'}</p>
                        </div>
                        <div class="card-footer d-flex justify-content-between">
                            <button class="btn btn-sm btn-outline-primary" onclick="editEquipment(${eq.id})"><i class="bi bi-pencil"></i></button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteEquipment(${eq.id})"><i class="bi bi-trash"></i></button>
                        </div>
                    </div>
                `;
                container.appendChild(col);
            });
        }

        function editEquipment(id) {
            // fetch single equipment
            FarmerAPI.get(`/api/equipment/${id}`).then(resp => {
                if (resp.ok) {
                    const eq = resp.data;
                    document.getElementById('equipmentId').value = eq.id;
                    document.getElementById('equipmentName').value = eq.name;
                    document.getElementById('equipmentType').value = eq.type || '';
                    document.getElementById('equipmentDescription').value = eq.description || '';
                    document.getElementById('equipmentPrice').value = eq.rentalPricePerDay;
                    document.getElementById('equipmentLocation').value = eq.location || '';
                    document.getElementById('equipmentAvailable').checked = eq.available;
                    new bootstrap.Modal(document.getElementById('equipmentModal')).show();
                } else {
                    FarmerAPI.showAlert('danger', 'Failed to fetch equipment for edit');
                }
            }).catch(e => {
                console.error(e);
                FarmerAPI.showAlert('danger', 'Error fetching equipment');
            });
        }

        async function saveEquipment() {
            const id = document.getElementById('equipmentId').value;
            const payload = {
                name: document.getElementById('equipmentName').value,
                type: document.getElementById('equipmentType').value,
                description: document.getElementById('equipmentDescription').value,
                rentalPricePerDay: parseFloat(document.getElementById('equipmentPrice').value),
                location: document.getElementById('equipmentLocation').value,
                available: document.getElementById('equipmentAvailable').checked,
                ownerId: currentUser.id // required for POST/PUT
            };
            FarmerAPI.showLoading(true);
            try {
                let resp;
                if (id) {
                    resp = await FarmerAPI.put(`/api/equipment/${id}`, payload);
                } else {
                    resp = await FarmerAPI.post(`/api/equipment`, payload);
                }
                if (resp.ok) {
                    FarmerAPI.showAlert('success', 'Equipment saved successfully');
                    bootstrap.Modal.getInstance(document.getElementById('equipmentModal')).hide();
                    loadEquipment();
                } else {
                    FarmerAPI.showAlert('danger', resp.data.error || 'Failed to save equipment');
                }
            } catch (e) {
                console.error(e);
                FarmerAPI.showAlert('danger', 'Error saving equipment');
            } finally {
                FarmerAPI.showLoading(false);
            }
        }

        async function deleteEquipment(id) {
            if (!confirm('Delete this equipment?')) return;
            FarmerAPI.showLoading(true);
            try {
                const resp = await FarmerAPI.del(`/api/equipment/${id}?ownerId=${currentUser.id}`);
                if (resp.ok) {
                    FarmerAPI.showAlert('success', 'Equipment deleted');
                    loadEquipment();
                } else {
                    FarmerAPI.showAlert('danger', resp.data.error || 'Failed to delete equipment');
                }
            } catch (e) {
                console.error(e);
                FarmerAPI.showAlert('danger', 'Error deleting equipment');
            } finally {
                FarmerAPI.showLoading(false);
            }
        }
    </script>
</body>
</html>
