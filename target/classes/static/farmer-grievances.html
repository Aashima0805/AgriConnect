<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Grievances - AgriConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="navbar-container"></div>
    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="mb-0"><i class="bi bi-chat-heart"></i> My Grievances</h2>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#grievanceModal"><i class="bi bi-plus-lg"></i> Raise Grievance</button>
        </div>
        <div id="alertContainer"></div>
        <div id="grievancesContainer" class="row g-3"></div>
    </main>
    <!-- Loading overlay -->
    <div id="loadingOverlay" class="agri-loading d-none" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.8);display:flex;justify-content:center;align-items:center;z-index:1050;">
        <div class="spinner-border text-success" role="status"><span class="visually-hidden">Loading...</span></div>
    </div>
    <!-- Grievance Modal -->
    <div class="modal fade" id="grievanceModal" tabindex="-1" aria-labelledby="grievanceModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="grievanceModalLabel">Add / Edit Grievance</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="grievanceForm">
                        <input type="hidden" id="grievanceId">
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" class="form-control" id="grievanceTitle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="grievanceDescription" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <input type="text" class="form-control" id="grievanceCategory">
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label">Target Amount</label>
                                <input type="number" step="0.01" class="form-control" id="grievanceTarget" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Location</label>
                                <input type="text" class="form-control" id="grievanceLocation">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveGrievance()">Save</button>
                </div>
            </div>
        </div>
    </div>
    <footer class="agri-footer mt-auto">
        <div class="container text-center">
            <p class="mb-0 small text-white-50">AgriConnect • Farmer Module</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script src="farmer-api.js"></script>
    <script>
        let currentUser = null;
        document.addEventListener('DOMContentLoaded', async () => {
            const user = AgriAuth.requireAuth('FARMER');
            if (!user) return;
            currentUser = user;
            AgriAuth.renderNavbar('navbar-container', 'grievances');
            loadGrievances();
        });

        async function loadGrievances() {
            FarmerAPI.showLoading(true);
            try {
                const resp = await FarmerAPI.get(`/api/grievances/farmer/${currentUser.id}`);
                if (resp.ok) {
                    renderGrievances(resp.data);
                } else {
                    FarmerAPI.showAlert('danger', resp.data.error || 'Failed to load grievances');
                }
            } catch (e) {
                console.error(e);
                FarmerAPI.showAlert('danger', 'Error loading grievances');
            } finally {
                FarmerAPI.showLoading(false);
            }
        }

        function statusBadge(status) {
            const map = {
                'OPEN': 'bg-primary',
                'PARTIALLY_FUNDED': 'bg-warning',
                'FUNDED': 'bg-success',
                'CLOSED': 'bg-secondary'
            };
            const cls = map[status] || 'bg-light text-dark';
            return `<span class="badge ${cls}">${status}</span>`;
        }

        function renderGrievances(list) {
            const container = document.getElementById('grievancesContainer');
            container.innerHTML = '';
            if (!list || list.length === 0) {
                container.innerHTML = '<p class="text-muted">No grievances found. Raise one using the button above.</p>';
                return;
            }
            list.forEach(g => {
                const col = document.createElement('div');
                col.className = 'col-md-6';
                col.innerHTML = `
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title">${g.title}</h5>
                            <h6 class="card-subtitle mb-2 text-muted">${g.category || ''}</h6>
                            <p class="card-text">${g.description || ''}</p>
                            <p class="card-text"><strong>Target:</strong> $${g.targetAmount}</p>
                            <p class="card-text"><strong>Received:</strong> $${g.receivedAmount || 0}</p>
                            <p class="card-text"><strong>Location:</strong> ${g.location || ''}</p>
                            ${statusBadge(g.status)}
                        </div>
                        <div class="card-footer d-flex justify-content-between">
                            <button class="btn btn-sm btn-outline-primary" onclick="editGrievance(${g.id})"><i class="bi bi-pencil"></i></button>
                            <!-- No delete endpoint defined -->
                        </div>
                    </div>
                `;
                container.appendChild(col);
            });
        }

        function editGrievance(id) {
            FarmerAPI.get(`/api/grievances/${id}`).then(resp => {
                if (resp.ok) {
                    const g = resp.data;
                    document.getElementById('grievanceId').value = g.id;
                    document.getElementById('grievanceTitle').value = g.title;
                    document.getElementById('grievanceDescription').value = g.description || '';
                    document.getElementById('grievanceCategory').value = g.category || '';
                    document.getElementById('grievanceTarget').value = g.targetAmount;
                    document.getElementById('grievanceLocation').value = g.location || '';
                    new bootstrap.Modal(document.getElementById('grievanceModal')).show();
                } else {
                    FarmerAPI.showAlert('danger', 'Failed to fetch grievance for edit');
                }
            }).catch(e => {
                console.error(e);
                FarmerAPI.showAlert('danger', 'Error fetching grievance');
            });
        }

        async function saveGrievance() {
            const id = document.getElementById('grievanceId').value;
            const payload = {
                title: document.getElementById('grievanceTitle').value,
                description: document.getElementById('grievanceDescription').value,
                category: document.getElementById('grievanceCategory').value,
                targetAmount: parseFloat(document.getElementById('grievanceTarget').value),
                location: document.getElementById('grievanceLocation').value,
                farmerId: currentUser.id // required for POST/PUT
            };
            FarmerAPI.showLoading(true);
            try {
                let resp;
                if (id) {
                    resp = await FarmerAPI.put(`/api/grievances/${id}`, payload);
                } else {
                    resp = await FarmerAPI.post(`/api/grievances`, payload);
                }
                if (resp.ok) {
                    FarmerAPI.showAlert('success', 'Grievance saved successfully');
                    bootstrap.Modal.getInstance(document.getElementById('grievanceModal')).hide();
                    loadGrievances();
                } else {
                    FarmerAPI.showAlert('danger', resp.data.error || 'Failed to save grievance');
                }
            } catch (e) {
                console.error(e);
                FarmerAPI.showAlert('danger', 'Error saving grievance');
            } finally {
                FarmerAPI.showLoading(false);
            }
        }
    </script>
</body>
</html>
