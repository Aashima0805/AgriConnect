<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriConnect Workspace - Redirecting</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom AgriConnect CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="text-center p-5">
        <div class="spinner-border text-success mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
        <h4 class="fw-bold text-dark">Redirecting to your AgriConnect Dashboard...</h4>
        <p class="text-muted small">Verifying your role-based workspace permissions.</p>
    </div>

    <!-- AgriAuth JS -->
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = AgriAuth.getUser();
            if (!user) {
                window.location.replace('login.html');
            } else {
                const targetUrl = AgriAuth.getDashboardUrl(user.role);
                window.location.replace(targetUrl);
            }
        });
    </script>
</body>
</html>
