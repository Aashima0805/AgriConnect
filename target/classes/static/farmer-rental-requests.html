<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rental Requests - AgriConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        .request-card {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 4px 14px rgba(0,0,0,0.05);
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 6px 10px;
            border-radius: 20px;
        }

        .request-detail {
            color: #6b7280;
            font-size: 0.92rem;
        }

        .request-detail strong {
            color: #374151;
        }
    </style>
</head>

<body>

<div id="navbar-container"></div>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">
                <i class="bi bi-clipboard-check text-success"></i>
                Rental Requests
            </h2>
            <p class="text-muted mb-0">
                Review requests from farmers who want to rent your equipment.
            </p>
        </div>

        <a href="farmer-equipment.html" class="btn btn-outline-success">
            <i class="bi bi-truck me-1"></i>
            My Equipment
        </a>
    </div>

    <div id="alertContainer"></div>

    <div id="loadingContainer" class="text-center py-5">
        <div class="spinner-border text-success" role="status"></div>
        <p class="text-muted mt-2">Loading rental requests...</p>
    </div>

    <div id="emptyContainer" class="text-center py-5 d-none">
        <i class="bi bi-inbox display-4 text-muted"></i>
        <h5 class="mt-3">No rental requests</h5>
        <p class="text-muted">
            You currently have no rental requests from other farmers.
        </p>
    </div>

    <div id="requestsContainer" class="row g-4"></div>

</main>

<footer class="agri-footer mt-auto">
    <div class="container text-center">
        <p class="mb-0 small text-white-50">
            AgriConnect • Farmer Module
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="auth.js"></script>
<script src="farmer-api.js"></script>

<script>

let currentUser = null;

document.addEventListener('DOMContentLoaded', async () => {

    const user = AgriAuth.requireAuth('FARMER');

    if (!user) return;

    currentUser = user;

    AgriAuth.renderNavbar('navbar-container', 'rental-requests');

    await loadRentalRequests();
});


async function loadRentalRequests() {

    const loading = document.getElementById('loadingContainer');
    const empty = document.getElementById('emptyContainer');
    const container = document.getElementById('requestsContainer');

    loading.classList.remove('d-none');
    empty.classList.add('d-none');
    container.innerHTML = '';

    try {

        const response = await FarmerAPI.get(
            `/api/equipment-rentals/owner/${currentUser.id}`
        );

        if (!response.ok) {

            showRentalAlert(
                'danger',
                response.data?.error || 'Failed to load rental requests.'
            );

            return;
        }

        renderRentalRequests(response.data);

    } catch (error) {

        console.error(error);

        showRentalAlert(
            'danger',
            'Unable to load rental requests. Please try again.'
        );

    } finally {

        loading.classList.add('d-none');
    }
}


function renderRentalRequests(requests) {

    const container = document.getElementById('requestsContainer');
    const empty = document.getElementById('emptyContainer');

    container.innerHTML = '';

    if (!requests || requests.length === 0) {

        empty.classList.remove('d-none');

        return;
    }

    requests.forEach(request => {

        const equipment = request.equipment || {};
        const renter = request.renter || {};

        const status = request.status || 'PENDING';

        const statusClass = getStatusClass(status);

        const card = document.createElement('div');

        card.className = 'col-md-6 col-lg-4';

        card.innerHTML = `
            <div class="request-card h-100 p-4">

                <div class="d-flex justify-content-between align-items-start mb-3">

                    <div>
                        <h5 class="mb-1">
                            ${escapeHtml(equipment.name || 'Equipment')}
                        </h5>

                        <small class="text-muted">
                            ${escapeHtml(equipment.type || '')}
                        </small>
                    </div>

                    <span class="badge ${statusClass} status-badge">
                        ${escapeHtml(status)}
                    </span>

                </div>

                <div class="mb-3">

                    <p class="request-detail mb-2">
                        <i class="bi bi-person me-2"></i>
                        <strong>Requested by:</strong>
                        ${escapeHtml(renter.name || 'Unknown farmer')}
                    </p>

                    <p class="request-detail mb-2">
                        <i class="bi bi-envelope me-2"></i>
                        <strong>Email:</strong>
                        ${escapeHtml(renter.email || '-')}
                    </p>

                    <p class="request-detail mb-2">
                        <i class="bi bi-calendar-event me-2"></i>
                        <strong>Rental period:</strong><br>
                        ${formatDate(request.startDate)}
                        → 
                        ${formatDate(request.endDate)}
                    </p>

                    <p class="request-detail mb-2">
                        <i class="bi bi-calendar3 me-2"></i>
                        <strong>Days:</strong>
                        ${request.numberOfDays || 0}
                    </p>

                    <p class="request-detail mb-2">
                        <i class="bi bi-currency-rupee me-2"></i>
                        <strong>Total amount:</strong>
                        ₹${formatAmount(request.rentalAmount)}
                    </p>

                    <p class="request-detail mb-0">
                        <i class="bi bi-credit-card me-2"></i>
                        <strong>Payment:</strong>
                        ${escapeHtml(request.paymentStatus || 'PENDING')}
                    </p>

                </div>

                ${
                    status === 'PENDING'
                    ? `
                        <div class="d-flex gap-2 mt-3">

                            <button
                                class="btn btn-success flex-fill"
                                onclick="approveRental(${request.id})">

                                <i class="bi bi-check-lg me-1"></i>
                                Approve
                            </button>

                            <button
                                class="btn btn-outline-danger flex-fill"
                                onclick="rejectRental(${request.id})">

                                <i class="bi bi-x-lg me-1"></i>
                                Reject
                            </button>

                        </div>
                    `
                    : ''
                }

            </div>
        `;

        container.appendChild(card);
    });
}


async function approveRental(rentalId) {

    try {

        const response = await FarmerAPI.put(
            `/api/equipment-rentals/${rentalId}/approve?ownerId=${currentUser.id}`
        );

        if (response.ok) {

            showRentalAlert(
                'success',
                'Rental request approved successfully.'
            );

            await loadRentalRequests();

        } else {

            showRentalAlert(
                'danger',
                response.data?.error || 'Failed to approve rental request.'
            );
        }

    } catch (error) {

        console.error(error);

        showRentalAlert(
            'danger',
            'Unable to approve rental request.'
        );
    }
}


async function rejectRental(rentalId) {

    try {

        const response = await FarmerAPI.put(
            `/api/equipment-rentals/${rentalId}/reject?ownerId=${currentUser.id}`
        );

        if (response.ok) {

            showRentalAlert(
                'success',
                'Rental request rejected.'
            );

            await loadRentalRequests();

        } else {

            showRentalAlert(
                'danger',
                response.data?.error || 'Failed to reject rental request.'
            );
        }

    } catch (error) {

        console.error(error);

        showRentalAlert(
            'danger',
            'Unable to reject rental request.'
        );
    }
}


function getStatusClass(status) {

    switch (status) {

        case 'PENDING':
            return 'bg-warning text-dark';

        case 'APPROVED':
            return 'bg-success';

        case 'ACTIVE':
            return 'bg-primary';

        case 'COMPLETED':
            return 'bg-secondary';

        case 'REJECTED':
            return 'bg-danger';

        case 'CANCELLED':
            return 'bg-dark';

        default:
            return 'bg-secondary';
    }
}


function formatDate(dateString) {

    if (!dateString) return '-';

    const date = new Date(dateString);

    return date.toLocaleDateString('en-IN', {
        day: '2-digit',
        month: 'short',
        year: 'numeric'
    });
}


function formatAmount(amount) {

    const value = Number(amount || 0);

    return value.toLocaleString('en-IN', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}


function escapeHtml(value) {

    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}


function showRentalAlert(type, message) {

    const container = document.getElementById('alertContainer');

    container.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            ${escapeHtml(message)}
            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert">
            </button>
        </div>
    `;
}

</script>

</body>
</html>
