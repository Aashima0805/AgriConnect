<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="auth.js"></script>

<script>
let currentUser = null;

document.addEventListener('DOMContentLoaded', async () => {

    currentUser = AgriAuth.requireAuth('FARMER');

    if (!currentUser) {
        return;
    }

    AgriAuth.renderNavbar('navbar-container', 'rent-equipment');

    await loadAvailableEquipment();
});

async function loadAvailableEquipment() {

    const loadingBox =
        document.getElementById('loadingBox');

    const errorBox =
        document.getElementById('errorBox');

    const emptyBox =
        document.getElementById('emptyBox');

    const grid =
        document.getElementById('equipmentGrid');

    try {

        const response = await fetch(
            '/api/equipment',
            {
                credentials: 'include'
            }
        );

        if (!response.ok) {
            throw new Error('Unable to load equipment.');
        }

        const equipmentList = await response.json();

        loadingBox.classList.add('d-none');

        const otherFarmersEquipment =
            equipmentList.filter(equipment =>
                equipment.ownerId !== currentUser.id &&
                equipment.available === true
            );

        if (otherFarmersEquipment.length === 0) {
            emptyBox.classList.remove('d-none');
            return;
        }

        grid.innerHTML =
            otherFarmersEquipment.map(renderEquipmentCard).join('');

    } catch (error) {

        loadingBox.classList.add('d-none');

        errorBox.textContent =
            error.message || 'Unable to load equipment.';

        errorBox.classList.remove('d-none');
    }
}

function renderEquipmentCard(equipment) {

    const price =
        Number(equipment.rentalPricePerDay || 0)
            .toLocaleString('en-IN');

    const ownerName =
        equipment.ownerName ||
        equipment.farmerName ||
        'Farmer';

    const location =
        equipment.location ||
        'Location not specified';

    return `
        <div class="col-md-6 col-lg-4">

            <div class="equipment-card">

                <div class="equipment-image">
                    <i class="bi bi-tractor"></i>
                </div>

                <div class="equipment-body">

                    <div class="d-flex justify-content-between align-items-start gap-2">

                        <h4 class="mb-1">
                            ${escapeHtml(equipment.name || 'Equipment')}
                        </h4>

                        <span class="badge bg-success-subtle text-success">
                            Available
                        </span>

                    </div>

                    <p class="text-muted mb-2">
                        ${escapeHtml(equipment.type || 'Agricultural Equipment')}
                    </p>

                    <p class="small text-muted">
                        ${escapeHtml(
                            equipment.description ||
                            'No description available.'
                        )}
                    </p>

                    <div class="equipment-price">
                        ₹${price}
                        <small class="text-muted fw-normal">
                            / day
                        </small>
                    </div>

                    <div class="owner-box">

                        <div class="small text-muted">
                            Equipment Owner
                        </div>

                        <strong>
                            ${escapeHtml(ownerName)}
                        </strong>

                        <div class="small text-muted mt-1">
                            <i class="bi bi-geo-alt me-1"></i>
                            ${escapeHtml(location)}
                        </div>

                    </div>

                    <button
                        class="btn btn-success w-100"
                        onclick="rentEquipment(${equipment.id})"
                    >
                        <i class="bi bi-calendar-check me-2"></i>
                        Rent Equipment
                    </button>

                </div>

            </div>

        </div>
    `;
}

function rentEquipment(equipmentId) {

    window.location.href =
        `farmer-equipment-rent.html?equipmentId=${equipmentId}`;
}

function escapeHtml(value) {

    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}
</script>
